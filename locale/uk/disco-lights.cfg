give-disco-lights-tool=[font=default-semibold][color=255,230,192]Коли в курсорі:\n ▪ __CONTROL_LEFT_CLICK__ і перетягніть, щоб додати джерело світла.\n ▪ __CONTROL_RIGHT_CLICK__ і перетягніть, щоб видалити джерела світла.\n ▪ __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ щоб відкрити налаштування світла.\n ▪ __CONTROL__disco-lights-tool-size-up__/__CONTROL__disco-lights-tool-size-down__ щоб змінити радіус.\n ▪ __CONTROL__disco-lights-tool-mode-up__/__CONTROL__disco-lights-tool-mode-down__ щоб змінити режим.[/color][/font]

