[shortcut-description]
give-disco-lights-tool=[font=default-semibold][color=255,230,192]When in cursor:\n ▪ __CONTROL_LEFT_CLICK__ and drag to add a light.\n ▪ __CONTROL_RIGHT_CLICK__ and drag to remove lights.\n ▪ __CONTROL_KEY_SHIFT____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ to open light settings.\n ▪ __CONTROL__disco-lights-tool-size-up__/__CONTROL__disco-lights-tool-size-down__ to change the radius.\n ▪ __CONTROL__disco-lights-tool-mode-up__/__CONTROL__disco-lights-tool-mode-down__ to change the mode.[/color][/font]

